[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-salary-intelligence-backend"
version = "0.1.0"
description = "ACME Salary Intelligence Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "openpyxl>=3.1.0",
    "faker>=30.0.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

